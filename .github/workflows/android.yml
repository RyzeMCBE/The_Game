name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify bundled content
        run: python3 tools/check_assets.py
      - name: Build native APK and unit tests
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Verify packaged audio and checksum
        run: |
          python3 tools/check_assets.py --apk app/build/outputs/apk/debug/app-debug.apk
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/mi-pequeno-mundo-noah-1.1.0-test.apk
          cd deliverables
          sha256sum mi-pequeno-mundo-noah-1.1.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mi-pequeno-mundo-apk
          path: deliverables/
          retention-days: 30
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native offline device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.ryzemc.pequenomundo.noah/files/qa app/build/device-screenshots
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/device-screenshots/
